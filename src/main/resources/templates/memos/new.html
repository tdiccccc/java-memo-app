<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>メモ作成</title>
</head>

<body>

    <h1>メモ作成</h1>

    <form th:action="@{/memos}" th:object="${memoForm}" method="post">
        <div>
            <label for="title">タイトル</label>
            <input type="text" id="title" th:field="*{title}">

            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red">
            </div>
        </div>

        <div>
            <label for="content">内容</label>

            <textarea id="content" th:field="*{content}"></textarea>

            <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" style="color:red">
            </div>
        </div>

        <button type="submit">保存</button>
    </form>

</body>

</html>
