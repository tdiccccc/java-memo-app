<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>メモ詳細</title>
</head>

<body>
    <h1>メモ詳細・編集</h1>

    <p>ID：<span th:text="${memo.id}"></span></p>

    <div th:replace="~{memos/_form :: form}"></div>

    <form th:action="@{/memos/{id}(id=${memo.id})}" method="post" onsubmit="return confirm('本当に削除しますか？')">

        <input type="hidden" name="_method" value="delete">

        <button type="submit">
            削除
        </button>

    </form>

    <a href="/memos">一覧へ戻る</a>
</body>

</html>
