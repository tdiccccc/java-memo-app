<div th:fragment="form">
    <form th:action="@{${actionUrl}}" th:object="${memoForm}" method="post">
        <input th:if="${method == 'put'}" type="hidden" name="_method" value="put">

        <div>
            <label for="title">タイトル</label>
            <input type="text" id="title" th:field="*{title}">
            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red"></div>
        </div>

        <div>
            <label for="content">内容</label>
            <textarea id="content" th:field="*{content}"></textarea>
            <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" style="color:red"></div>
        </div>

        <button type="submit">保存</button>
    </form>
</div>
